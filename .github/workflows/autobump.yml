name: brew bump
on:
  push:
    branches: [main]
    paths: [.github/workflows/autobump.yml]
  schedule:
    - cron: '35 13 * * *'
  workflow_dispatch:
permissions: {}
defaults:
  run:
    shell: bash -xeuo pipefail {0}
jobs:
  autobump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
      - name: Bump other formulae without duplicating verified fv-ssh-unlock updates
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
        run: brew bump --no-fork --open-pr --formulae --bump-synced shoon/tap/takeout-helper-gphotos
